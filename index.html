<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c6ee6">
  <title>🔮 Ramalkan Akibatnya! | Pendidikan Moral Tahun 5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="homeBtn" class="icon-btn" aria-label="Kembali ke menu">🏠</button>
    <div class="brand">🔮 <span>RAMALKAN AKIBATNYA!</span></div>
    <div class="top-actions">
      <button id="soundBtn" class="icon-btn" aria-label="Buka atau tutup bunyi">🔊</button>
      <button id="teacherBtn" class="teacher-btn">⚙️ MOD GURU</button>
    </div>
  </header>
  <main id="app" class="app"></main>
  <div id="teacherModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button id="closeTeacher" class="close-btn" aria-label="Tutup">✕</button>
      <h2>⚙️ Mod Guru</h2>
      <label>Pilih situasi
        <select id="teacherSituation"></select>
      </label>
      <div class="teacher-grid">
        <button id="jumpSituation">Pergi ke situasi</button>
        <button id="repeatSituation">Ulang situasi</button>
        <button id="showSuggestion">Tunjuk jawapan cadangan</button>
        <button id="toggleHints">Bantuan: <span id="hintState">Aktif</span></button>
        <button id="toggleSoundTeacher">Bunyi: <span id="soundState">Aktif</span></button>
        <button id="resetGame" class="danger">Reset permainan</button>
      </div>
      <div id="teacherAnswer" class="teacher-answer"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
